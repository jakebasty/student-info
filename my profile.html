  </div>

<script>
  function toggleEditMode(isEditing) {
    const viewEl = document.getElementById('profile-details-view');
    const formEl = document.getElementById('profile-edit-form');
    const editBtn = document.getElementById('edit-details-btn');

    if (isEditing) {
      viewEl.classList.add('hidden');
      formEl.classList.remove('hidden');
      formEl.classList.add('flex');
      editBtn.classList.add('hidden');
    } else {
      formEl.classList.add('hidden');
      formEl.classList.remove('flex');
      viewEl.classList.remove('hidden');
      editBtn.classList.remove('hidden');
    }
  }

  function saveProfile(e) {
    e.preventDefault();
    const name = document.getElementById('input-full-name').value.trim();
    const email = document.getElementById('input-email').value.trim();
    const phone = document.getElementById('input-phone').value.trim();

    document.getElementById('display-name-header').textContent = name;
    document.getElementById('detail-full-name').textContent = name;
    document.getElementById('detail-email').textContent = email;
    document.getElementById('detail-phone').textContent = phone;

    toggleEditMode(false);
    triggerToast('Profile updated');
  }

  function copyValue(text, btn) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).catch(() => {});
    }
    const icon = btn.querySelector('.material-symbols-outlined');
    icon.textContent = 'check';
    triggerToast('Copied to clipboard');
    setTimeout(() => {
      icon.textContent = 'content_copy';
    }, 1500);
  }

  function showLogoutToast() {
    triggerToast('Signed out of StudInfo');
  }

  let toastTimer;
  function triggerToast(message) {
    const toast = document.getElementById('profile-toast');
    toast.textContent = message;
    toast.classList.remove('opacity-0');
    toast.classList.add('opacity-100');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0');
    }, 2200);
  }
</script></main>
