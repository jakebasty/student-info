<script>
  function updateLiveName() {
    const first = document.getElementById('first-name').value.trim();
    const middle = document.getElementById('middle-name').value.trim();
    const last = document.getElementById('last-name').value.trim();
    const parts = [first, middle, last].filter(Boolean);
    document.getElementById('live-full-name').textContent = parts.length ? parts.join(' ') : 'Student Name';
  }

  function showToast(msg) {
    const toast = document.getElementById('toast-banner');
    const text = document.getElementById('toast-message');
    text.textContent = msg;
    toast.classList.remove('hidden');
    setTimeout(() => {
      toast.classList.add('hidden');
    }, 2600);
  }

  function triggerPhotoToast() {
    showToast('Photo upload ready');
  }

  function handleSave(e) {
    e.preventDefault();
    const btn = document.getElementById('save-btn');
    const btnText = document.getElementById('save-btn-text');
    btnText.textContent = 'Saving...';
    btn.disabled = true;
    setTimeout(() => {
      btnText.textContent = 'Saved';
      showToast('Your profile details have been updated');
      setTimeout(() => {
        btnText.textContent = 'Save Changes';
        btn.disabled = false;
      }, 1500);
    }, 500);
  }
