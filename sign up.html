<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"on-tertiary-fixed":"#1d1b1a","tertiary-fixed-dim":"#cac6c3","outline":"#747878","surface-container-highest":"#e2e2e4","background":"#f9f9fb","on-background":"#1a1c1d","on-primary-fixed":"#1c1b1b","primary-container":"#1c1b1b","on-secondary-container":"#626267","on-secondary-fixed-variant":"#46464b","inverse-surface":"#2f3132","surface-dim":"#d9dadc","on-error-container":"#93000a","surface-container-low":"#f3f3f5","surface-variant":"#e2e2e4","surface-container":"#eeeef0","surface-container-high":"#e8e8ea","surface-bright":"#f9f9fb","tertiary":"#000000","on-tertiary":"#ffffff","tertiary-fixed":"#e6e1df","inverse-primary":"#c8c6c5","secondary":"#5d5e63","on-tertiary-fixed-variant":"#484645","secondary-fixed":"#e3e2e7","primary-fixed":"#e5e2e1","surface":"#f9f9fb","on-tertiary-container":"#868381","primary":"#000000","on-primary-container":"#858383","secondary-fixed-dim":"#c6c6cb","inverse-on-surface":"#f0f0f2","secondary-container":"#e0dfe4","error":"#ba1a1a","error-container":"#ffdad6","on-secondary":"#ffffff","on-surface-variant":"#444748","on-error":"#ffffff","on-primary-fixed-variant":"#474646","on-primary":"#ffffff","surface-container-lowest":"#ffffff","tertiary-container":"#1d1b1a","on-secondary-fixed":"#1a1b1f","outline-variant":"#c4c7c7","on-surface":"#1a1c1d","primary-fixed-dim":"#c8c6c5","surface-tint":"#5f5e5e"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"gutter":"1rem","space-xs":"0.25rem","space-md":"1rem","margin":"1.25rem","space-sm":"0.5rem","space-lg":"1.5rem","space-xl":"2rem"},"fontFamily":{"headline-md":["Inter"],"label-lg":["Inter"],"label-md":["Inter"],"body-sm":["Inter"],"body-md":["Inter"],"headline-lg":["Inter"],"label-sm":["Inter"],"body-lg":["Inter"],"headline-sm":["Inter"]},"fontSize":{"headline-md":["22px",{"lineHeight":"28px","letterSpacing":"-0.015em","fontWeight":"600"}],"label-lg":["15px",{"lineHeight":"20px","fontWeight":"600"}],"label-md":["13px",{"lineHeight":"18px","fontWeight":"500"}],"body-sm":["13px",{"lineHeight":"18px","fontWeight":"400"}],"body-md":["15px",{"lineHeight":"22px","fontWeight":"400"}],"headline-lg":["28px",{"lineHeight":"34px","letterSpacing":"-0.02em","fontWeight":"700"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.02em","fontWeight":"500"}],"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}],"headline-sm":["18px",{"lineHeight":"24px","letterSpacing":"-0.01em","fontWeight":"600"}]}}}}</script></head><body class="bg-surface font-body-md text-body-md text-on-surface pt-safe pb-safe flex flex-col"><main class="flex flex-col relative w-full px-margin bg-surface"><div class="flex flex-col w-full pb-space-xl">
<!-- Header Section -->
<div class="flex flex-col pt-space-lg pb-space-xl">
<div class="flex items-center justify-between mb-space-md">
<div class="inline-flex items-center gap-space-xs px-3 py-1.5 rounded-full bg-surface-container-low text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">school</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">StudInfo</span>
</div>
<span class="font-label-sm text-label-sm text-secondary">Student Portal</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-space-xs">
      Create Account
    </h1>
<p class="font-body-md text-body-md text-secondary">
      Set up your academic profile in just a few moments.
    </p>
</div>
<!-- Sign Up Form -->
<form class="flex flex-col gap-space-md" id="signup-form" novalidate="">
<!-- Name Group -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="first-name">
        First Name
      </label>
<input autocomplete="given-name" class="w-full h-12 px-4 rounded-xl bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md shadow-sm focus:outline-none focus:shadow-md transition-shadow" id="first-name" placeholder="e.g. Maya" required="" type="text"/>
</div>
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="middle-name">
          Middle Name
        </label>
<span class="font-label-sm text-label-sm text-outline">Optional</span>
</div>
<input autocomplete="additional-name" class="w-full h-12 px-4 rounded-xl bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md shadow-sm focus:outline-none focus:shadow-md transition-shadow" id="middle-name" placeholder="e.g. Lin" type="text"/>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="last-name">
        Last Name
      </label>
<input autocomplete="family-name" class="w-full h-12 px-4 rounded-xl bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md shadow-sm focus:outline-none focus:shadow-md transition-shadow" id="last-name" placeholder="e.g. Chen" required="" type="text"/>
</div>
<!-- Contact Group -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">
        Email Address
      </label>
<input autocomplete="email" class="w-full h-12 px-4 rounded-xl bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md shadow-sm focus:outline-none focus:shadow-md transition-shadow" id="email" placeholder="maya.chen@university.edu" required="" type="email"/>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="mobile">
        Mobile Number
      </label>
<input autocomplete="tel" class="w-full h-12 px-4 rounded-xl bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md shadow-sm focus:outline-none focus:shadow-md transition-shadow" id="mobile" placeholder="+1 (555) 234-5678" required="" type="tel"/>
</div>
<!-- Password -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">
        Password
      </label>
<div class="relative flex items-center">
<input autocomplete="new-password" class="w-full h-12 pl-4 pr-12 rounded-xl bg-surface-container-lowest text-on-surface placeholder:text-outline font-body-md text-body-md shadow-sm focus:outline-none focus:shadow-md transition-shadow" id="password" placeholder="Create a strong password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-2 w-9 h-9 flex items-center justify-center rounded-lg text-secondary hover:text-on-surface active:scale-95 transition-all" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Action -->
<div class="pt-space-md flex flex-col gap-space-md">
<button class="w-full h-12 rounded-xl bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-sm active:scale-[0.98] transition-all" id="register-btn" type="submit">
<span id="register-label">Register</span>
<span class="material-symbols-outlined text-[18px]" id="register-icon">arrow_forward</span>
</button>
<!-- Secondary Navigation -->
<div class="flex items-center justify-center pt-space-xs">
<a class="inline-flex items-center gap-space-xs py-2 px-4 rounded-xl font-label-md text-label-md text-secondary hover:text-on-surface transition-colors" href="#login">
<span>Back to Login</span>
</a>
</div>
</div>
</form>
<!-- Subtle Inline Feedback Toast -->
<div class="hidden mt-space-md p-space-md rounded-xl bg-surface-container-low text-on-surface flex items-center gap-space-sm" id="form-toast">
<span class="material-symbols-outlined text-[20px] text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-sm text-body-sm">Account details ready! Welcome to StudInfo.</span>
</div>
</div>
<script>
  (function () {
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggle-icon');

    if (toggleBtn && passwordInput && toggleIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    const form = document.getElementById('signup-form');
    const registerBtn = document.getElementById('register-btn');
    const registerLabel = document.getElementById('register-label');
    const registerIcon = document.getElementById('register-icon');
    const toast = document.getElementById('form-toast');

    if (form && registerBtn && registerLabel && registerIcon && toast) {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        registerLabel.textContent = 'Creating Account...';
        registerIcon.textContent = 'hourglass_top';
        registerBtn.disabled = true;

        setTimeout(function () {
          registerLabel.textContent = 'Registered';
          registerIcon.textContent = 'check';
          toast.classList.remove('hidden');
          registerBtn.disabled = false;
        }, 650);
      });
    }
  })();
</script></main></body></html>
