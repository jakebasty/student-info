<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"on-tertiary-fixed":"#1d1b1a","tertiary-fixed-dim":"#cac6c3","outline":"#747878","surface-container-highest":"#e2e2e4","background":"#f9f9fb","on-background":"#1a1c1d","on-primary-fixed":"#1c1b1b","primary-container":"#1c1b1b","on-secondary-container":"#626267","on-secondary-fixed-variant":"#46464b","inverse-surface":"#2f3132","surface-dim":"#d9dadc","on-error-container":"#93000a","surface-container-low":"#f3f3f5","surface-variant":"#e2e2e4","surface-container":"#eeeef0","surface-container-high":"#e8e8ea","surface-bright":"#f9f9fb","tertiary":"#000000","on-tertiary":"#ffffff","tertiary-fixed":"#e6e1df","inverse-primary":"#c8c6c5","secondary":"#5d5e63","on-tertiary-fixed-variant":"#484645","secondary-fixed":"#e3e2e7","primary-fixed":"#e5e2e1","surface":"#f9f9fb","on-tertiary-container":"#868381","primary":"#000000","on-primary-container":"#858383","secondary-fixed-dim":"#c6c6cb","inverse-on-surface":"#f0f0f2","secondary-container":"#e0dfe4","error":"#ba1a1a","error-container":"#ffdad6","on-secondary":"#ffffff","on-surface-variant":"#444748","on-error":"#ffffff","on-primary-fixed-variant":"#474646","on-primary":"#ffffff","surface-container-lowest":"#ffffff","tertiary-container":"#1d1b1a","on-secondary-fixed":"#1a1b1f","outline-variant":"#c4c7c7","on-surface":"#1a1c1d","primary-fixed-dim":"#c8c6c5","surface-tint":"#5f5e5e"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"gutter":"1rem","space-xs":"0.25rem","space-md":"1rem","margin":"1.25rem","space-sm":"0.5rem","space-lg":"1.5rem","space-xl":"2rem"},"fontFamily":{"headline-md":["Inter"],"label-lg":["Inter"],"label-md":["Inter"],"body-sm":["Inter"],"body-md":["Inter"],"headline-lg":["Inter"],"label-sm":["Inter"],"body-lg":["Inter"],"headline-sm":["Inter"]},"fontSize":{"headline-md":["22px",{"lineHeight":"28px","letterSpacing":"-0.015em","fontWeight":"600"}],"label-lg":["15px",{"lineHeight":"20px","fontWeight":"600"}],"label-md":["13px",{"lineHeight":"18px","fontWeight":"500"}],"body-sm":["13px",{"lineHeight":"18px","fontWeight":"400"}],"body-md":["15px",{"lineHeight":"22px","fontWeight":"400"}],"headline-lg":["28px",{"lineHeight":"34px","letterSpacing":"-0.02em","fontWeight":"700"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.02em","fontWeight":"500"}],"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}],"headline-sm":["18px",{"lineHeight":"24px","letterSpacing":"-0.01em","fontWeight":"600"}]}}}}</script></head><body class="bg-surface font-body-md text-body-md text-on-surface pt-safe pb-safe flex flex-col"><main class="flex flex-col relative w-full px-margin bg-surface"><div class="flex flex-col w-full">
<div class="flex flex-col items-start pt-space-xl pb-space-xl">
<div class="flex items-center gap-space-sm mb-space-xs">
<div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[20px]">school</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">StudInfo</h1>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back. Let's get you signed in.</p>
</div>
<form class="flex flex-col gap-space-md w-full" id="login-form" novalidate="">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative flex items-center">
<input autocomplete="email" class="w-full h-12 px-space-md rounded-xl bg-surface-container-lowest text-on-surface placeholder:text-on-surface-variant/60 font-body-md text-body-md shadow-sm focus:outline-none focus:shadow-md transition-shadow" id="email" placeholder="student@university.edu" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<button class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors" type="button">
          Forgot?
        </button>
</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-12 pl-space-md pr-12 rounded-xl bg-surface-container-lowest text-on-surface placeholder:text-on-surface-variant/60 font-body-md text-body-md shadow-sm focus:outline-none focus:shadow-md transition-shadow" id="password" placeholder="Enter your password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 w-8 h-8 flex items-center justify-center rounded-lg text-on-surface-variant hover:text-on-surface transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggle-icon">visibility</span>
</button>
</div>
</div>
<div class="pt-space-sm">
<button class="w-full h-12 rounded-xl bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-sm active:scale-[0.98] transition-all" id="login-btn" type="submit">
<span id="login-btn-text">Log In</span>
</button>
</div>
</form>
<div class="flex items-center justify-center pt-space-xl pb-space-lg">
<p class="font-body-sm text-body-sm text-on-surface-variant">
      Don't have an account?
      <a class="font-label-md text-label-md text-on-surface ml-1 hover:underline" href="#">Sign Up</a>
</p>
</div>
</div>
<script>
  (function () {
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggle-icon');
    const loginForm = document.getElementById('login-form');
    const loginBtn = document.getElementById('login-btn');
    const loginBtnText = document.getElementById('login-btn-text');

    if (toggleBtn && passwordInput && toggleIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (loginForm && loginBtn && loginBtnText) {
      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        loginBtnText.textContent = 'Signing in...';
        loginBtn.classList.add('opacity-80');
        setTimeout(function () {
          loginBtnText.textContent = 'Log In';
          loginBtn.classList.remove('opacity-80');
        }, 1200);
      });
    }
  })();
</script></main></body></html>
